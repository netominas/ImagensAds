<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar acesso · AdStudio</title><link rel="stylesheet" href="/styles.css"></head><body><main style="max-width:520px;margin:10vh auto;padding:32px" class="panel"><h1>Ative seu estúdio</h1><p>Defina o e-mail e a senha do administrador. Este link só pode ser usado uma vez.</p><form id="activate"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Senha — pelo menos 14 caracteres</label><input id="password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required><label for="confirm">Confirme a senha</label><input id="confirm" type="password" autocomplete="new-password" required><button class="button primary" style="margin-top:24px" type="submit">Criar meu acesso</button><p id="message" role="status"></p></form></main><script src="/activate.js" defer></script></body></html>
